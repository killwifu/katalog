# Сбор метрик прод-стека. Всё внутри сети compose, наружу не торчит.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/katalog/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8080"]}]
  - job_name: worker
    static_configs: [{targets: ["worker:8081"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"]}]
