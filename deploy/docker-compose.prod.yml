# Прод-стек: один сервер, образы из GHCR, хранилище — облачный S3.
# Запуск на сервере:
#   docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d
#
# Отличия от deploy/docker-compose.yml (локального):
#   - нет minio/minio-init: фото живут в облачном S3-совместимом хранилище;
#   - нет build: образы тянутся из GHCR по тегу (их собирает CI);
#   - Postgres и Redis не публикуют порты наружу — только внутренняя сеть;
#   - Caddy слушает 80 и 443 и выпускает TLS сам.
name: katalog

# Логи контейнеров — в json-file без лимита по умолчанию: за месяцы они
# съедают диск, и первой падает запись в Postgres. 5 файлов по 20 МБ на
# сервис, `docker compose logs` работает как раньше.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER обязателен}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-katalog}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-katalog}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER обязателен}/katalog-migrate:${IMAGE_TAG:-latest}
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-katalog}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    image: ghcr.io/${GHCR_OWNER}/katalog-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-katalog}?sslmode=disable
      REDIS_ADDR: redis:6379
      # Облачный S3: endpoint провайдера, тот же и для pre-signed URL клиенту.
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT обязателен}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT обязателен}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET обязателен}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY обязателен}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY обязателен}
      # Регион в scope подписи SigV4. MinIO принимает любой, облачные
      # провайдеры проверяют: у Yandex Object Storage — ru-central1.
      S3_REGION: ${S3_REGION:?S3_REGION обязателен}
      # Деривативы отдаёт CDN-домен, не домен приложения.
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:?MEDIA_BASE_URL обязателен}
      COOKIE_SECURE: "true"
      STOREFRONT_URL: http://storefront:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET обязателен}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      BILLING_RETURN_URL: https://${APP_DOMAIN}/app/billing
      SITE_URL: https://${APP_DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      STOP_WORDS: ${STOP_WORDS:-}
      # Ошибки API в Sentry; тот же DSN API отдаёт фронтам
      # (/api/v1/public/config). Пусто — ошибки только в логах.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    image: ghcr.io/${GHCR_OWNER}/katalog-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      WORKER_HEALTH_ADDR: ":8081"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-katalog}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      STOREFRONT_URL: http://storefront:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      # Пустой SMTP_HOST — письма пишутся в лог воркера. Регистрация и вход
      # работают (подтверждение почты нигде не гейтит), но сброс пароля
      # практически недоступен: ссылка уходит только в лог.
      # Отложено — см. «Что отложено» в README.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
      SITE_URL: https://${APP_DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      TRAFFIC_ALERT_MULTIPLIER: ${TRAFFIC_ALERT_MULTIPLIER:-5}
      TRAFFIC_ALERT_MIN_VIEWS: ${TRAFFIC_ALERT_MIN_VIEWS:-1000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Ежесуточный pg_dump в S3. По умолчанию — основной бакет, префикс
  # backup/pg/ (аноним читает только drv/*). Надёжнее отдельный бакет
  # с ключом без права удаления: deploy/s3/setup-backup.sh, BACKUP_S3_*.
  # Восстановление — README «Бэкапы».
  backup:
    image: ghcr.io/${GHCR_OWNER}/katalog-backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-katalog}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${BACKUP_S3_BUCKET:-${S3_BUCKET}}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-${S3_ACCESS_KEY}}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-${S3_SECRET_KEY}}
      AWS_DEFAULT_REGION: ${S3_REGION}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # Heartbeat-монитор (healthchecks.io и т.п.): пинг после каждого
      # успешного дампа. Пусто — бэкап работает, но его сбой никто не заметит.
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  # --- Мониторинг: метрики, алерты в Telegram, Grafana ----------------------
  # Наружу ничего не публикуется; Grafana — только на 127.0.0.1 сервера,
  # открывать через SSH-туннель (README «Метрики и алерты»). Лимиты памяти —
  # чтобы мониторинг на VM в 2 ГБ не вытеснил сам продукт.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    logging: *logging
    mem_limit: 300m
    command:
      - --config.file=/etc/katalog/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    # Каталогом, а не файлами: git checkout подменяет файл новым inode, и
    # смонтированный по одному файл в контейнере остался бы старым (как было
    # с Caddyfile). Деплой перезапускает мониторинг, если каталог изменился.
    volumes:
      - ./monitoring:/etc/katalog:ro
      - promdata:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    entrypoint: ["/bin/sh", "/etc/katalog/alertmanager.sh"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./monitoring:/etc/katalog:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    command: [--path.rootfs=/host]
    pid: host
    volumes:
      - /:/host:ro,rslave

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    environment:
      DATA_SOURCE_NAME: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-katalog}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    logging: *logging
    mem_limit: 200m
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # Не обязателен, чтобы деплой не упал на старом .env: Grafana слушает
      # только 127.0.0.1, а make-env.sh предупреждает о пустом значении.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafanadata:/var/lib/grafana

  storefront:
    image: ghcr.io/${GHCR_OWNER}/katalog-storefront:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      API_URL: http://api:8080
      REDIS_URL: redis://redis:6379
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      SITE_URL: https://${APP_DOMAIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  cabinet:
    image: ghcr.io/${GHCR_OWNER}/katalog-cabinet:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 5s
      timeout: 3s
      retries: 12

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN обязателен}
      ACME_EMAIL: ${ACME_EMAIL:?нужен email для Let's Encrypt}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy
      storefront:
        condition: service_healthy
      cabinet:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, а не localhost: в контейнере localhost резолвится в ::1,
      # а admin-API Caddy слушает только IPv4 — healthcheck не проходил ни разу.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  promdata:
  grafanadata:
