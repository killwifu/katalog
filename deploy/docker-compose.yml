name: katalog

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-katalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-katalog}
      POSTGRES_DB: ${POSTGRES_DB:-katalog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-katalog} -d ${POSTGRES_DB:-katalog}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Одноразовый init: создаёт бакет при старте стека.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-katalog}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set download local/$$S3_BUCKET/drv
      "
    restart: "no"

  # Одноразовый init: применяет goose-миграции.
  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-katalog}:${POSTGRES_PASSWORD:-katalog}@postgres:5432/${POSTGRES_DB:-katalog}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: api
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-katalog}:${POSTGRES_PASSWORD:-katalog}@postgres:5432/${POSTGRES_DB:-katalog}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-katalog}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # По умолчанию относительный /media (его проксирует Caddy в MinIO);
      # в проде — отдельный CDN-домен, см. deploy/docker-compose.prod.yml.
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-/media}
      STOREFRONT_URL: http://storefront:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      BILLING_RETURN_URL: ${BILLING_RETURN_URL:-http://localhost/app/billing}
      SITE_URL: ${SITE_URL:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      STOP_WORDS: ${STOP_WORDS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: worker
    environment:
      WORKER_HEALTH_ADDR: ":8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-katalog}:${POSTGRES_PASSWORD:-katalog}@postgres:5432/${POSTGRES_DB:-katalog}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-katalog}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STOREFRONT_URL: http://storefront:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
      SITE_URL: ${SITE_URL:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      TRAFFIC_ALERT_MULTIPLIER: ${TRAFFIC_ALERT_MULTIPLIER:-5}
      TRAFFIC_ALERT_MIN_VIEWS: ${TRAFFIC_ALERT_MIN_VIEWS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  storefront:
    build:
      context: ../frontend/storefront
    environment:
      API_URL: http://api:8080
      REDIS_URL: redis://redis:6379
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret}
      SITE_URL: ${SITE_URL:-http://localhost}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Статика кабинета (Vite build) за внутренним caddy file-server.
  cabinet:
    build:
      context: ../frontend/cabinet
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 5s
      timeout: 3s
      retries: 12

  caddy:
    image: caddy:2-alpine
    environment:
      # Имя бакета в маршрутах: /{bucket}/orig/* и /media/* -> /{bucket}/drv/.
      S3_BUCKET: ${S3_BUCKET:-katalog}
      # Host для SigV4-подписи при проксировании загрузок в MinIO. По умолчанию —
      # плейсхолдер Caddy: Host клиента как есть (обычное поведение reverse-proxy).
      # Задаётся, только если внешний прокси переписывает Host (Codespaces);
      # тогда значение = host из S3_PUBLIC_ENDPOINT (без схемы).
      S3_SIGNING_HOST: ${S3_SIGNING_HOST:-{http.request.hostport}}
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy
      storefront:
        condition: service_healthy
      cabinet:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
