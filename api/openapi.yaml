openapi: 3.1.0
info:
  title: Katalog API
  description: >
    REST API сервиса Katalog. Источник правды для контрактов:
    клиентские типы генерируются из этого файла (orval).
    Аутентификация: сессионная httpOnly cookie `katalog_session`.
    Тенант-изоляция: любой чужой или несуществующий ресурс — 404.
  version: 0.3.0
servers:
  - url: /

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      responses:
        "200":
          description: Сервис жив
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /api/v1/auth/register:
    post:
      operationId: register
      summary: Регистрация по email и паролю (argon2id), создаёт сессию
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "201":
          description: Пользователь создан, cookie установлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Вход, создаёт сессию
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "200":
          description: Сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Выход (инвалидация сессии)
      responses:
        "204": { description: Сессия удалена }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/me:
    get:
      operationId: me
      summary: Текущий пользователь
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/shops:
    post:
      operationId: createShop
      summary: Создать магазин (slug валидируется, системные слова запрещены)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string, minLength: 3, maxLength: 63 }
                name: { type: string, maxLength: 200 }
                description: { type: string }
                contacts: { type: object }
      responses:
        "201":
          description: Магазин создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: listShops
      summary: Магазины текущего пользователя
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shop"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/shops/{shopID}:
    parameters:
      - $ref: "#/components/parameters/ShopID"
    get:
      operationId: getShop
      summary: Магазин по id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateShop
      summary: Обновить магазин (частично)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string }
                contacts: { type: object }
                settings: { type: object }
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteShop
      summary: Удалить магазин
      responses:
        "204": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shops/{shopID}/albums:
    parameters:
      - $ref: "#/components/parameters/ShopID"
    post:
      operationId: createAlbum
      summary: Создать альбом (вложенность максимум 2 уровня)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
                parent_id: { type: string, format: uuid }
                sort_order: { type: integer }
      responses:
        "201":
          description: Альбом создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      operationId: listAlbums
      summary: Альбомы магазина
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Album"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shops/{shopID}/albums/{albumID}:
    parameters:
      - $ref: "#/components/parameters/ShopID"
      - $ref: "#/components/parameters/AlbumID"
    get:
      operationId: getAlbum
      summary: Альбом по id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAlbum
      summary: Обновить альбом (title, sort_order, is_hidden, cover_photo_id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                sort_order: { type: integer }
                is_hidden: { type: boolean }
                cover_photo_id:
                  type: [string, "null"]
                  format: uuid
                  description: Пустая строка сбрасывает обложку; фото должно принадлежать альбому
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteAlbum
      summary: Удалить альбом
      responses:
        "204": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shops/{shopID}/albums/{albumID}/photos:
    parameters:
      - $ref: "#/components/parameters/ShopID"
      - $ref: "#/components/parameters/AlbumID"
    get:
      operationId: listPhotos
      summary: Фото альбома (со статусами обработки)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Photo"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/uploads/presign:
    post:
      operationId: presignUpload
      summary: Pre-signed URL для прямой загрузки оригинала в S3
      description: >
        Проверяет владение альбомом и квоту тарифа. Создаёт запись фото
        в статусе uploading. Файл загружается PUT-запросом напрямую в S3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shop_id, album_id, size]
              properties:
                shop_id: { type: string, format: uuid }
                album_id: { type: string, format: uuid }
                size: { type: integer, minimum: 1, maximum: 52428800 }
      responses:
        "200":
          description: URL выдан
          content:
            application/json:
              schema:
                type: object
                required: [photo_id, url]
                properties:
                  photo_id: { type: string, format: uuid }
                  url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Квота тарифа исчерпана (error=quota_exceeded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/photos/confirm:
    post:
      operationId: confirmPhotos
      summary: Подтвердить загрузку — постановка в очередь обработки
      description: >
        Для каждого фото: проверка объекта в S3, uploading -> processing,
        задача воркеру (asynq). Ответ по каждому фото отдельно.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shop_id, photo_ids]
              properties:
                shop_id: { type: string, format: uuid }
                photo_ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Результаты по каждому фото
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [photo_id, status]
                      properties:
                        photo_id: { type: string }
                        status: { type: string }
                        error: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/photos/{photoID}:
    parameters:
      - name: photoID
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updatePhoto
      summary: Обновить подпись фото
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caption: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletePhoto
      summary: Удалить фото (объекты S3, квота, счётчик альбома)
      responses:
        "204": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- Публичный неймспейс витрины (без сессии, отдельные схемы ответов:
  # ---- приватные поля наружу не отдаются никогда) ----

  /api/v1/public/shops/{slug}:
    get:
      operationId: getPublicShop
      summary: Шапка магазина и сетка не скрытых альбомов
      parameters:
        - $ref: "#/components/parameters/ShopSlug"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [shop, albums]
                properties:
                  shop: { $ref: "#/components/schemas/PublicShop" }
                  albums:
                    type: array
                    items: { $ref: "#/components/schemas/PublicAlbum" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/public/shops/{slug}/albums/{albumID}:
    get:
      operationId: getPublicAlbum
      summary: Фото альбома (только ready) с пагинацией
      parameters:
        - $ref: "#/components/parameters/ShopSlug"
        - $ref: "#/components/parameters/AlbumID"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 60 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [shop, album, photos, page, per_page, total]
                properties:
                  shop: { $ref: "#/components/schemas/PublicShop" }
                  album: { $ref: "#/components/schemas/PublicAlbum" }
                  photos:
                    type: array
                    items: { $ref: "#/components/schemas/PublicPhoto" }
                  page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/public/shops/{slug}/search:
    get:
      operationId: searchPublicPhotos
      summary: Поиск по подписям в рамках магазина (FTS russian + pg_trgm fallback)
      parameters:
        - $ref: "#/components/parameters/ShopSlug"
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: OK (максимум 50 результатов)
          content:
            application/json:
              schema:
                type: object
                required: [query, photos]
                properties:
                  query: { type: string }
                  photos:
                    type: array
                    items: { $ref: "#/components/schemas/PublicPhoto" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/public/lead-click:
    post:
      operationId: createLeadClick
      summary: >
        Фиксация клика «написать по товару». visitor_hash строится из
        анонимной cookie kv (устанавливается сервером) и IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shop_id, channel]
              properties:
                shop_id: { type: string, format: uuid }
                photo_id: { type: string, format: uuid }
                channel: { type: string, enum: [telegram, whatsapp, max, vk] }
      responses:
        "204": { description: Лид зафиксирован }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/public/sitemap:
    get:
      operationId: getPublicSitemap
      summary: Активные магазины для sitemap витрины
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [shops]
                properties:
                  shops:
                    type: array
                    items:
                      type: object
                      required: [slug, updated_at]
                      properties:
                        slug: { type: string }
                        updated_at: { type: string, format: date-time }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  parameters:
    ShopSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    ShopID:
      name: shopID
      in: path
      required: true
      schema: { type: string, format: uuid }
    AlbumID:
      name: albumID
      in: path
      required: true
      schema: { type: string, format: uuid }

  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, format: email }
              password: { type: string, minLength: 8 }

  responses:
    BadRequest:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Нет или истекла сессия / неверные креды
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Ресурс не найден или принадлежит другому пользователю
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Конфликт (занятый email/slug)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Превышен rate-limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, description: Машинный код ошибки }
        message: { type: string }

    User:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, "null"], format: email }

    Shop:
      type: object
      required: [id, slug, name, description, contacts, settings, status, plan, storage_used, storage_max]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        contacts: { type: object }
        settings: { type: object }
        status: { type: string, enum: [active, suspended, deleted] }
        plan: { type: string, enum: [free, pro] }
        storage_used: { type: integer }
        storage_max: { type: integer }

    Album:
      type: object
      required: [id, parent_id, title, cover_photo_id, sort_order, is_hidden, photo_count]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: [string, "null"], format: uuid }
        title: { type: string }
        cover_photo_id: { type: [string, "null"], format: uuid }
        sort_order: { type: integer }
        is_hidden: { type: boolean }
        photo_count: { type: integer }

    PublicShop:
      type: object
      description: Публичная витрина — без email, storage_used, plan, status
      required: [id, slug, name, description, contacts, msg_template]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        contacts:
          type: object
          description: "Каналы связи: telegram/whatsapp/vk/max -> handle"
        msg_template:
          type: string
          description: Шаблон сообщения покупателя, плейсхолдер {caption}

    PublicAlbum:
      type: object
      required: [id, parent_id, title, photo_count]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: [string, "null"], format: uuid }
        title: { type: string }
        photo_count: { type: integer }
        cover_urls: { $ref: "#/components/schemas/PhotoUrls" }

    PublicPhoto:
      type: object
      required: [id, album_id, caption, width, height, urls]
      properties:
        id: { type: string, format: uuid }
        album_id: { type: string, format: uuid }
        caption: { type: string }
        width: { type: integer }
        height: { type: integer }
        urls: { $ref: "#/components/schemas/PhotoUrls" }

    PhotoUrls:
      type: object
      description: Деривативы WebP (300/800/1600), отдаются с CDN-пути /media
      properties:
        thumb: { type: string }
        medium: { type: string }
        large: { type: string }

    Photo:
      type: object
      required: [id, album_id, caption, status, width, height, sort_order]
      properties:
        id: { type: string, format: uuid }
        album_id: { type: string, format: uuid }
        caption: { type: string }
        status: { type: string, enum: [uploading, processing, ready, failed, blocked] }
        width: { type: integer }
        height: { type: integer }
        sort_order: { type: integer }
        urls:
          type: object
          description: Только для status=ready; деривативы WebP (300/800/1600)
          properties:
            thumb: { type: string }
            medium: { type: string }
            large: { type: string }
