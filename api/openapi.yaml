# Ограничения длины текстовых полей считаются в символах, не в байтах:
# кириллица в UTF-8 занимает два байта, и побайтовый счёт давал продавцу
# вдвое меньше заявленного.
openapi: 3.1.0
info:
  title: Katalog API
  description: >
    REST API сервиса Katalog. Источник правды для контрактов:
    клиентские типы генерируются из этого файла (orval).
    Аутентификация: сессионная httpOnly cookie `katalog_session`.
    Тенант-изоляция: любой чужой или несуществующий ресурс — 404.
    Тело запроса принимается только с `Content-Type: application/json`
    (иначе 415, error=unsupported_media_type) и ровно одним JSON-объектом;
    символ NUL (\u0000) в строках и в адресе запроса — 400; поля, которых
    нет в схеме тела, — 400 (bad_json). Числовые параметры запроса (page,
    per_page, days) не отклоняются: выход за границы приводится к границе.
  version: 0.7.0
servers:
  - url: /

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Health probe — API, Postgres и Redis доступны
      responses:
        "200":
          description: Сервис жив, база и Redis отвечают
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        "503":
          description: Postgres или Redis недоступны
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string

  /api/v1/auth/register:
    post:
      operationId: register
      summary: Регистрация по email и паролю (argon2id), создаёт сессию
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "201":
          description: Пользователь создан, cookie установлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Вход, создаёт сессию
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "200":
          description: Сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  # Вход и выход выставляют две cookie: httpOnly-сессию katalog_session
  # и открытый скрипту маркер katalog_signed="1". Маркер нужен статической
  # главной витрины: она отдаётся из кеша всем одинаково и о сессии знать
  # не может, поэтому шапка читает маркер, чтобы написать «Кабинет».
  # Авторизацией маркер не является — доступ проверяется только сессией.
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Выход (инвалидация сессии)
      responses:
        "204": { description: Сессия удалена }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/me:
    get:
      operationId: me
      summary: Текущий пользователь
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Запросить сброс пароля (письмо со ссылкой)
      description: >
        Всегда 204 — существование email не раскрывается. Если email
        зарегистрирован, на него уходит одноразовая ссылка (TTL 1 час).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204": { description: Принято }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/auth/password/reset:
    post:
      operationId: resetPassword
      summary: Установить новый пароль по токену из письма
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Пароль обновлён }
        "400":
          description: Токен недействителен/использован (error=invalid_token) или слабый пароль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/auth/password/change:
    post:
      operationId: changePassword
      summary: Сменить пароль из кабинета
      description: >
        Требует текущий пароль. Остальные сессии пользователя закрываются,
        текущая выдаётся заново (Set-Cookie). Rate-limit как у входа.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Пароль изменён }
        "400":
          description: >
            Неверный текущий пароль (error=wrong_password), слабый новый
            (error=weak_password) или длиннее 128 символов (error=password_too_long)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Подтвердить email по токену из письма регистрации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Email подтверждён }
        "400":
          description: Токен недействителен или использован (error=invalid_token)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/shops:
    post:
      operationId: createShop
      summary: Создать магазин (slug валидируется, системные слова запрещены)
      description: >
        Описание — не длиннее 1000 символов: оно уходит в публичную выдачу
        на каждый заход покупателя.
        409 отдаётся и на занятый slug (slug_taken), и на превышение
        потолка в пять магазинов на владельца (shop_limit). Занятым
        считается и адрес, освобождённый другим магазином при смене:
        полгода он доступен только прежнему владельцу, иначе разосланные
        покупателям ссылки уводили бы в чужой магазин.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, name]
              properties:
                slug: { type: string, pattern: "^[a-z0-9](?:[a-z0-9]|-[a-z0-9]){2,62}$" }
                name: { type: string, maxLength: 200 }
                description: { type: string }
                contacts:
                  type: object
                  additionalProperties: { type: string }
                  description: >
                    Каналы связи: telegram, whatsapp, vk, max. Значение —
                    ник или, для vk и max, полная ссылка на сам мессенджер
                    (vk.me, vk.com, m.vk.com / max.ru, m.max.ru). Ссылка на
                    любой другой хост отклоняется (invalid_contacts), как и
                    ник с недопустимыми символами. telegram — ник, @ник,
                    ссылка t.me/ник или t.me/+номер, иначе invalid_telegram;
                    whatsapp — номер в международном формате (invalid_whatsapp).
      responses:
        "201":
          description: Магазин создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
    get:
      operationId: listShops
      summary: Магазины текущего пользователя
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shop"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/shops/{shopID}:
    parameters:
      - $ref: "#/components/parameters/ShopID"
    get:
      operationId: getShop
      summary: Магазин по id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateShop
      summary: Обновить магазин (частично)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string }
                contacts: { type: object }
                settings: { type: object }
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Недоступно на Бесплатном тарифе (error=watermark_plan_required — включение водяного знака)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
    delete:
      operationId: deleteShop
      summary: Удалить магазин
      responses:
        "204": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shops/{shopID}/billing:
    parameters:
      - $ref: "#/components/parameters/ShopID"
    get:
      operationId: getBilling
      summary: Тариф, лимиты, использование и подписка магазина
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Billing"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shops/{shopID}/stats:
    parameters:
      - $ref: "#/components/parameters/ShopID"
    get:
      operationId: getShopStats
      summary: Статистика магазина за период (дашборд продавца)
      description: >
        Просмотры и уникальные — из daily_stats (по вчерашний день, ночная
        агрегация); клики «написать», разбивка по каналам и топ фото —
        из lead_clicks в реальном времени.
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 30 }
          description: Период 1–365 дней; больше 365 — 365, остальное некорректное — 30.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopStats"
        "403":
          description: Недоступно на Бесплатном тарифе (error=analytics_plan_required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shops/{shopID}/billing/subscribe:
    parameters:
      - $ref: "#/components/parameters/ShopID"
    post:
      operationId: subscribe
      summary: Сменить тариф (оплата через ЮKassa или переход ниже)
      description: >
        Сумма и вид платежа — как в GET /billing/quote. Для оплаты создаёт
        платёж ЮKassa (с сохранением способа оплаты для рекуррентных
        списаний) и возвращает confirmation_url; return_url получает
        ?payment={payment_id}. Тариф активируется только после вебхука
        payment.succeeded. Переход ниже (в т.ч. на free) не требует оплаты:
        scheduled=true, вступает в силу с конца оплаченного периода.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan]
              properties:
                plan: { $ref: "#/components/schemas/PlanID" }
                period: { $ref: "#/components/schemas/BillingPeriod" }
      responses:
        "200":
          description: Платёж создан или переход ниже запланирован
          content:
            application/json:
              schema:
                type: object
                required: [scheduled]
                properties:
                  payment_id: { type: string, format: uuid }
                  confirmation_url: { type: string, format: uri }
                  scheduled: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Этот тариф уже текущий (error=plan_is_current)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: ЮKassa недоступна (error=payment_provider_error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Платежи не сконфигурированы (error=billing_unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/shops/{shopID}/billing/cancel:
    parameters:
      - $ref: "#/components/parameters/ShopID"
    post:
      operationId: cancelSubscription
      summary: Отключить автопродление подписки
      description: >
        Тариф действует до конца оплаченного периода, затем аккаунт переходит
        на Бесплатный (витрина работает). Запланированный переход ниже
        отменяется. Идемпотентен.
      responses:
        "204": { description: Автопродление отключено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shops/{shopID}/billing/resume:
    parameters:
      - $ref: "#/components/parameters/ShopID"
    post:
      operationId: resumeSubscription
      summary: Включить автопродление обратно (без оплаты)
      responses:
        "204": { description: Автопродление включено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Нечего включать: период закончился или нет сохранённого способа
            оплаты (error=resume_unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/shops/{shopID}/billing/trial:
    parameters:
      - $ref: "#/components/parameters/ShopID"
    post:
      operationId: startTrial
      summary: Включить пробный «Про» на 7 дней без карты
      description: >
        Один раз на аккаунт, только на Бесплатном и только если платного
        тарифа не было. По окончании, если не оплачено, — Бесплатный.
        Регистрация «с пробным периодом» вызывает его сразу после создания магазина.
      responses:
        "204": { description: Пробный период включён }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Пробный период недоступен (error=trial_unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/shops/{shopID}/billing/quote:
    parameters:
      - $ref: "#/components/parameters/ShopID"
    get:
      operationId: quoteBilling
      summary: Предпросмотр смены тарифа — сумма, дни, даты
      parameters:
        - name: plan
          in: query
          required: true
          schema: { $ref: "#/components/schemas/PlanID" }
        - name: period
          in: query
          required: false
          schema: { $ref: "#/components/schemas/BillingPeriod" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingQuote" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shops/{shopID}/billing/payments:
    parameters:
      - $ref: "#/components/parameters/ShopID"
    get:
      operationId: listPayments
      summary: История платежей, новые сверху (до 100)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [payments]
                properties:
                  payments:
                    type: array
                    items: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/billing/webhooks/yookassa:
    post:
      operationId: yooKassaWebhook
      summary: Вебхук ЮKassa о статусах платежей
      description: >
        Без сессии. Уведомления ЮKassa не подписаны, поэтому статус платежа
        перепроверяется прямым запросом к API ЮKassa. Обработка идемпотентна:
        повторная доставка события — no-op с 200. Не-2xx ответ означает,
        что ЮKassa должна доставить уведомление повторно.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, event, object]
              properties:
                type: { type: string, const: notification }
                event:
                  type: string
                  enum: [payment.succeeded, payment.canceled, payment.waiting_for_capture]
                object:
                  type: object
                  description: Объект платежа ЮKassa
      responses:
        "200":
          description: Уведомление обработано (или уже было обработано)
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Платёж не зарегистрирован (error=unknown_payment), нужен ретрай
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Не удалось перепроверить платёж в ЮKassa, нужен ретрай
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Платежи не сконфигурированы
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/shops/{shopID}/categories/{categoryID}/albums/order:
    parameters:
      - $ref: "#/components/parameters/ShopID"
      - name: categoryID
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setCategoryAlbumOrder
      summary: Порядок альбомов внутри категории
      description: >
        Альбомы получают места по порядку в album_ids. У каждой категории
        порядок свой; в нём альбомы стоят на странице категории и в её
        разделе на главной витрины. Альбомы не из этой категории (в том
        числе чужие) пропускаются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [album_ids]
              properties:
                album_ids:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string, format: uuid }
      responses:
        "204": { description: Порядок сохранён }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/shops/{shopID}/categories/{categoryID}/albums/{albumID}:
    parameters:
      - $ref: "#/components/parameters/ShopID"
      - name: categoryID
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/AlbumID"
    put:
      operationId: addAlbumToCategory
      summary: Положить альбом в категорию, не вынимая из остальных
      description: >
        Альбом может лежать в нескольких категориях. Повторное добавление —
        не ошибка. PATCH …/albums/{albumID}/category по-прежнему оставляет
        альбому ровно одну категорию (или ни одной).
      responses:
        "204": { description: Добавлен }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeAlbumFromCategory
      summary: Убрать альбом из категории
      description: Сам альбом и его место в других категориях не трогаются.
      responses:
        "204": { description: Убран }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shops/{shopID}/categories/{categoryID}/visibility:
    patch:
      operationId: setCategoryVisibility
      summary: Скрыть категорию с витрины или убрать с главной
      description: >
        is_hidden — покупатель не видит категорию ни в меню, ни по её адресу
        (вместе с подкатегориями); альбомы остаются доступны по ссылке.
        on_home — категория показывается блоком на главной витрины.
        Переданное поле меняется, непереданное остаётся как было.
      parameters:
        - $ref: "#/components/parameters/ShopID"
        - name: categoryID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                is_hidden: { type: boolean }
                on_home: { type: boolean }
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/shops/{shopID}/trash:
    parameters:
      - $ref: "#/components/parameters/ShopID"
    get:
      operationId: listTrash
      description: >
        Корзина магазина. Фотография попадает сюда при удалении и лежит
        keep_days дней, всё это время занимая место в хранилище: объекты
        в S3 остаются до окончательной уборки.
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
          description: Номер страницы 1–1000000; больше — 1000000, остальное некорректное — 1.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [albums, photos, total, page, per_page, keep_days]
                properties:
                  albums:
                    type: array
                    description: >
                      Удалённые альбомы — только на первой странице. Фото,
                      уехавшие вместе с альбомом, в photos не дублируются.
                    items:
                      type: object
                      required: [id, title, photo_count, deleted_at]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        photo_count: { type: integer }
                        deleted_at: { type: string, format: date-time }
                        cover_urls: { $ref: "#/components/schemas/PhotoUrls" }
                  photos:
                    type: array
                    items: { $ref: "#/components/schemas/Photo" }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }
                  keep_days:
                    type: integer
                    description: срок хранения до окончательной уборки, дней
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: emptyTrash
      description: >
        Очищает корзину целиком. Необратимо: объекты уходят из S3,
        освободившееся место возвращается в квоту магазина.
      responses:
        "204":
          description: Очищено
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/shops/{shopID}/trash/albums/{albumID}/restore:
    post:
      operationId: restoreAlbum
      summary: Вернуть альбом из корзины
      description: >
        Возвращает альбом с подальбомами и фотографиями, которые уехали в
        корзину вместе с ним. Фото, удалённые раньше по отдельности, остаются
        в корзине.
      parameters:
        - $ref: "#/components/parameters/ShopID"
        - $ref: "#/components/parameters/AlbumID"
      responses:
        "200":
          description: Альбом возвращён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shops/{shopID}/trash/albums/{albumID}:
    delete:
      operationId: purgeAlbum
      summary: Удалить альбом из корзины окончательно
      description: Удаляет строки и объекты в S3, возвращает место в квоте.
      parameters:
        - $ref: "#/components/parameters/ShopID"
        - $ref: "#/components/parameters/AlbumID"
      responses:
        "204": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shops/{shopID}/trash/{photoID}:
    parameters:
      - $ref: "#/components/parameters/ShopID"
      - in: path
        name: photoID
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: purgePhoto
      description: Удаляет одну фотографию из корзины навсегда.
      responses:
        "204":
          description: Удалено
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/shops/{shopID}/trash/{photoID}/restore:
    parameters:
      - $ref: "#/components/parameters/ShopID"
      - in: path
        name: photoID
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restorePhoto
      description: >
        Возвращает фотографию из корзины в её альбом и на витрину.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/shops/{shopID}/albums:
    parameters:
      - $ref: "#/components/parameters/ShopID"
    post:
      operationId: createAlbum
      description: >
        409 (album_limit), если в магазине уже 1000 альбомов. Столько же
        отдаёт публичная выдача магазина — потолок держит горячий путь
        предсказуемым.
      summary: Создать альбом (вложенность максимум 2 уровня)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
                parent_id: { type: string, format: uuid }
                sort_order: { type: integer, format: int32 }
                watermark: { $ref: "#/components/schemas/AlbumWatermark" }
      responses:
        "201":
          description: Альбом создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Недоступно на Бесплатном тарифе (error=watermark_plan_required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
    get:
      operationId: listAlbums
      summary: Альбомы магазина
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Album"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shops/{shopID}/albums/{albumID}:
    parameters:
      - $ref: "#/components/parameters/ShopID"
      - $ref: "#/components/parameters/AlbumID"
    get:
      operationId: getAlbum
      summary: Альбом по id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAlbum
      description: >
        parent_id применяется: пустая строка выносит альбом на верхний
        уровень. 400 (too_deep), если родитель сам вложен или у альбома есть
        подальбомы — уровней всего два.
      summary: Обновить альбом (title, description, sort_order, status, cover_photo_id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, maxLength: 200 }
                sort_order: { type: integer, format: int32 }
                status: { $ref: "#/components/schemas/AlbumStatus" }
                description:
                  type: string
                  maxLength: 2000
                  description: Условия покупки; на витрине показывается над фотографиями
                cover_photo_id:
                  type: [string, "null"]
                  format: uuid
                  description: Пустая строка сбрасывает обложку; фото должно принадлежать альбому
                password:
                  type: string
                  maxLength: 64
                  description: >
                    Пароль альбома: строка 4–64 символа задаёт его, пустая
                    снимает. На бесплатном тарифе пароль нельзя ни задать, ни
                    сменить, ни снять — 403 password_plan_required; поставленный
                    на платном тарифе при понижении продолжает действовать.
                watermark: { $ref: "#/components/schemas/AlbumWatermark" }
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Недоступно на Бесплатном тарифе (error=watermark_plan_required / password_plan_required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
    delete:
      operationId: deleteAlbum
      summary: Удалить альбом — в «Удаленное»
      description: >
        Альбом с подальбомами и фотографиями уезжает в корзину и пропадает из
        кабинета и с витрины. Место в квоте не освобождается до окончательного
        удаления (purgeAlbum, emptyTrash или ночная уборка по сроку хранения).
      responses:
        "204": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shops/{shopID}/albums/{albumID}/photos:
    parameters:
      - $ref: "#/components/parameters/ShopID"
      - $ref: "#/components/parameters/AlbumID"
    get:
      operationId: listPhotos
      summary: Фото альбома со статусами обработки, страницами
      description: >
        Альбом на тарифе «Продавец» вмещает до 5000 фотографий, поэтому
        выдача постраничная — как и на витрине.
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: Номер страницы 1–1000000; больше — 1000000, остальное некорректное — 1.
        - name: per_page
          in: query
          schema: { type: integer, default: 100 }
          description: Размер страницы 1–500; больше 500 — 500, остальное некорректное — 100.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [photos, page, per_page, total]
                properties:
                  photos:
                    type: array
                    items:
                      $ref: "#/components/schemas/Photo"
                  page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/uploads/presign:
    post:
      operationId: presignUpload
      summary: Pre-signed URL для прямой загрузки оригинала в S3
      description: >
        Проверяет владение альбомом и квоту тарифа. Создаёт запись фото
        в статусе uploading. Файл загружается PUT-запросом напрямую в S3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shop_id, album_id, size]
              properties:
                shop_id: { type: string, format: uuid }
                album_id: { type: string, format: uuid }
                size: { type: integer, minimum: 1, maximum: 10485760 }
      responses:
        "200":
          description: URL выдан
          content:
            application/json:
              schema:
                type: object
                required: [photo_id, url]
                properties:
                  photo_id: { type: string, format: uuid }
                  url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            Мягкий отказ: квота тарифа исчерпана (error=quota_exceeded —
            хранилище, error=photo_quota_exceeded — число фото). После перехода
            на Бесплатный загруженное сверх лимита остаётся, но новые фото не
            загрузить, пока не удалить лишние.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/photos/confirm:
    post:
      operationId: confirmPhotos
      summary: Подтвердить загрузку — постановка в очередь обработки
      description: >
        Для каждого фото: проверка объекта в S3, uploading -> processing,
        задача воркеру (asynq). Ответ по каждому фото отдельно.
        Подтверждённые фото встают в альбоме сразу после первой фотографии
        (обложки) в порядке перечисления в photo_ids; то, что стояло после
        обложки, сдвигается за пачку. В пустом альбоме первое фото пачки
        становится первым. Не больше 200 фото за запрос.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shop_id, photo_ids]
              properties:
                shop_id: { type: string, format: uuid }
                photo_ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Результаты по каждому фото
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [photo_id, status]
                      properties:
                        photo_id: { type: string }
                        status: { type: string }
                        error: { type: string }
                        code:
                          type: string
                          description: >
                            Машинный код отказа. quota_exceeded — файл не
                            помещается в тариф; file_too_large — фактически
                            загруженный файл больше лимита на одно фото
                            (presigned PUT размер не ограничивает), фото
                            помечается failed, объект удаляется.
                          enum: [quota_exceeded, file_too_large]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/photos/{photoID}:
    parameters:
      - name: photoID
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updatePhoto
      summary: Обновить подпись фото
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                caption: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
    delete:
      operationId: deletePhoto
      summary: Удалить фото — в «Удаленное»; незавершённую загрузку — совсем
      description: >
        Обработанное фото уезжает в корзину: объекты в S3 остаются, место в
        квоте не возвращается до окончательного удаления. Фото в статусе
        uploading (ссылка выдана, confirm не пришёл) — это отменённая
        загрузка: строка и объект удаляются сразу, в корзину она не попадает.
      responses:
        "204": { description: Удалено }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- Публичный неймспейс витрины (без сессии, отдельные схемы ответов:
  # ---- приватные поля наружу не отдаются никогда) ----

  /api/v1/shops/{shopID}/tabs:
    get:
      operationId: listTabs
      summary: Вкладки витрины (системные и свои)
      parameters:
        - $ref: "#/components/parameters/ShopID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tab" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createTab
      summary: Своя вкладка
      parameters:
        - $ref: "#/components/parameters/ShopID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, slug]
              properties:
                title: { type: string, minLength: 1, maxLength: 100 }
                slug: { type: string, pattern: "^[a-z0-9](?:[a-z0-9]|-[a-z0-9]){2,62}$" }
                sort_order: { type: integer, format: int32, default: 0 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tab" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: slug уже занят в этом магазине }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/shops/{shopID}/albums/{albumID}/stats:
    get:
      operationId: getAlbumStats
      summary: Показатели альбома за 7 дней
      description: >
        Просмотры — из ночной агрегации daily_stats (за неделю и за
        предыдущую, для сравнения); переходы в мессенджер — из lead_clicks
        в реальном времени.
      parameters:
        - $ref: "#/components/parameters/ShopID"
        - $ref: "#/components/parameters/AlbumID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [views_week, views_prev_week, lead_clicks]
                properties:
                  views_week: { type: integer }
                  views_prev_week: { type: integer }
                  lead_clicks: { type: integer }
        "403":
          description: Недоступно на Бесплатном тарифе (error=analytics_plan_required)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/shops/{shopID}/albums/{albumID}/download:
    get:
      operationId: downloadAlbum
      summary: Скачать все фото альбома одним архивом
      description: >
        Отдаёт zip с оригиналами обработанных фото в порядке альбома
        (001.jpg, 002.jpg, …). С ?check=1 вместо архива возвращает число
        фото и суммарный размер — кабинет проверяет этим, что архив есть
        из чего собрать, прежде чем начинать скачивание. Если в ids
        ровно одно фото, отдаётся сам оригинал файлом, без архива.
      parameters:
        - $ref: "#/components/parameters/ShopID"
        - $ref: "#/components/parameters/AlbumID"
        - name: check
          in: query
          schema: { type: string }
        - name: ids
          in: query
          schema: { type: string }
          description: Через запятую — скачать только эти фото альбома
      responses:
        "200":
          description: Архив (application/zip) либо, с check, сводка
          content:
            application/zip:
              schema: { type: string, format: binary }
            application/json:
              schema:
                type: object
                properties:
                  photos: { type: integer }
                  bytes: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: В альбоме нет готовых фото (album_empty)

  /api/v1/shops/{shopID}/albums/{albumID}/photos/order:
    put:
      operationId: setPhotoOrder
      summary: Задать порядок фотографий на странице альбома
      description: >
        Порядок = порядок id в массиве. Список может быть страницей, а не
        альбомом целиком: перечисленные фото получают свои же места в новом
        порядке, фото с других страниц не сдвигаются. Чужие id ни на что
        не влияют — запрос ограничен магазином и альбомом. Первое фото
        альбома становится обложкой, если она не выбрана явно.
      parameters:
        - $ref: "#/components/parameters/ShopID"
        - $ref: "#/components/parameters/AlbumID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [photo_ids]
              properties:
                photo_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "204":
          description: Порядок сохранён
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/shops/{shopID}/tabs/order:
    put:
      operationId: setTabOrder
      summary: Задать порядок вкладок целиком
      description: >
        Порядок = порядок id в массиве. Чужие id ни на что не влияют —
        запрос ограничен shop_id.
      parameters:
        - $ref: "#/components/parameters/ShopID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tab_ids]
              properties:
                tab_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "204":
          description: Порядок сохранён
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/shops/{shopID}/tabs/{tabID}:
    patch:
      operationId: updateTab
      parameters:
        - $ref: "#/components/parameters/ShopID"
        - { name: tabID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 100 }
                sort_order: { type: integer, format: int32 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tab" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: deleteTab
      summary: Удалить свою вкладку; системная отвечает 404
      parameters:
        - $ref: "#/components/parameters/ShopID"
        - { name: tabID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/shops/{shopID}/tabs/{tabID}/sections:
    post:
      operationId: createSection
      parameters:
        - $ref: "#/components/parameters/ShopID"
        - { name: tabID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 100 }
                sort_order: { type: integer, format: int32, default: 0 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Section" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/shops/{shopID}/sections:
    get:
      operationId: listSections
      parameters:
        - $ref: "#/components/parameters/ShopID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Section" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/shops/{shopID}/sections/{sectionID}:
    patch:
      operationId: updateSection
      parameters:
        - $ref: "#/components/parameters/ShopID"
        - { name: sectionID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 100 }
                sort_order: { type: integer, format: int32 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Section" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: deleteSection
      parameters:
        - $ref: "#/components/parameters/ShopID"
        - { name: sectionID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/shops/{shopID}/sections/{sectionID}/albums:
    put:
      operationId: setSectionAlbums
      summary: Задать состав секции целиком; порядок в массиве — порядок на витрине
      description: Чужие альбомы молча отбрасываются запросом.
      parameters:
        - $ref: "#/components/parameters/ShopID"
        - { name: sectionID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [album_ids]
              properties:
                album_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "204": { description: No Content }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/public/shops/{slug}/tabs/{tabSlug}:
    get:
      operationId: getPublicTab
      summary: Секции вкладки с альбомами; пустой массив — секций нет
      parameters:
        - $ref: "#/components/parameters/ShopSlug"
        - { name: tabSlug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicSection" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/ShopUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/shops/{shopID}/categories:
    get:
      operationId: listCategories
      summary: Категории магазина (плоский список, дерево строит клиент)
      parameters:
        - $ref: "#/components/parameters/ShopID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createCategory
      summary: Создать категорию (вложенность максимум 2 уровня)
      description: >
        Если sort_order не задан (или 0), категория встаёт в конец своего
        уровня — после тех, что продавец уже расставил.
      parameters:
        - $ref: "#/components/parameters/ShopID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: slug уже занят в этом магазине
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/shops/{shopID}/categories/{categoryID}:
    patch:
      operationId: updateCategory
      summary: Переименовать категорию или сменить родителя
      description: >
        parent_id применяется: отсутствующее или пустое поле означает верхний
        уровень. 400 (too_deep), если родитель сам вложен или у категории есть
        подкатегории — уровней всего два.
      parameters:
        - $ref: "#/components/parameters/ShopID"
        - name: categoryID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: slug уже занят в этом магазине
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: deleteCategory
      summary: Удалить категорию; альбомы не удаляются
      description: >
        Альбомы удаляемой категории переносятся в move_to.
        Без параметра остаются без категории. Подкатегория удаляемой
        категории целью быть не может (удаляется вместе с ней) — 400
        error=invalid_move_to.
      parameters:
        - $ref: "#/components/parameters/ShopID"
        - name: categoryID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: move_to
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "204": { description: No Content }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/shops/{shopID}/albums/{albumID}/category:
    patch:
      operationId: setAlbumCategory
      summary: Привязать альбом к категории (null — снять)
      parameters:
        - $ref: "#/components/parameters/ShopID"
        - $ref: "#/components/parameters/AlbumID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                category_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/public/shops/{slug}/categories:
    get:
      operationId: getPublicCategories
      summary: Дерево категорий витрины
      parameters:
        - $ref: "#/components/parameters/ShopSlug"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicCategory" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/ShopUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/public/shops/{slug}/categories/{categorySlug}:
    get:
      operationId: getPublicCategory
      summary: Альбомы категории; у родителя видны и альбомы вложенных
      parameters:
        - $ref: "#/components/parameters/ShopSlug"
        - name: categorySlug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicAlbum" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/ShopUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/public/shops/{slug}:
    get:
      operationId: getPublicShop
      summary: Шапка магазина и сетка не скрытых альбомов
      parameters:
        - $ref: "#/components/parameters/ShopSlug"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [shop, albums]
                properties:
                  shop: { $ref: "#/components/schemas/PublicShop" }
                  albums:
                    type: array
                    items: { $ref: "#/components/schemas/PublicAlbum" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/ShopUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/public/shops/{slug}/albums/{albumID}/unlock:
    post:
      operationId: unlockPublicAlbum
      summary: Проверить пароль альбома и получить пропуск
      description: >
        Пропуск — случайный токен на 12 часов. Его передают заголовком
        X-Album-Token в getPublicAlbum. Смена пароля продавцом гасит выданные
        пропуска. Лимит попыток — как у входа. Пароль закрывает страницу
        альбома, обложку в списках и поиск по подписям; адреса файлов на CDN
        остаются публичными. Подальбом без своего пароля закрыт паролем
        родителя: его unlock проверяет пароль родителя, и пропуск родителя
        открывает подальбом. Подальбом скрытого родителя (черновик, тариф,
        модератор) не отдаётся вовсе — 404 и нет в списках и поиске.
      parameters:
        - $ref: "#/components/parameters/ShopSlug"
        - $ref: "#/components/parameters/AlbumID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Пароль верный
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_in]
                properties:
                  token: { type: string }
                  expires_in: { type: integer, description: Секунды }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Неверный пароль (wrong_password)
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/public/shops/{slug}/albums/{albumID}:
    get:
      operationId: getPublicAlbum
      summary: Фото альбома (только ready) с пагинацией
      parameters:
        - $ref: "#/components/parameters/ShopSlug"
        - $ref: "#/components/parameters/AlbumID"
        - name: X-Album-Token
          in: header
          required: false
          schema: { type: string }
          description: Пропуск закрытого паролем альбома (см. unlockPublicAlbum)
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: Номер страницы 1–1000000; больше — 1000000, остальное некорректное — 1.
        - name: per_page
          in: query
          schema: { type: integer, default: 60 }
          description: Размер страницы 1–100; больше 100 — 100, остальное некорректное — 60.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [shop, album, children, photos, page, per_page, total]
                properties:
                  shop: { $ref: "#/components/schemas/PublicShop" }
                  album: { $ref: "#/components/schemas/PublicAlbum" }
                  children:
                    type: array
                    description: >
                      Вложенные альбомы этого альбома. Пусто у обычного
                      альбома; нужны, чтобы ссылка на родительскую категорию
                      не вела на пустую страницу.
                    items: { $ref: "#/components/schemas/PublicAlbum" }
                  photos:
                    type: array
                    items: { $ref: "#/components/schemas/PublicPhoto" }
                  page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/ShopUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/public/shops/{slug}/search:
    get:
      operationId: searchPublicPhotos
      summary: Поиск по подписям в рамках магазина (FTS russian + pg_trgm fallback)
      parameters:
        - $ref: "#/components/parameters/ShopSlug"
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: OK (максимум 50 результатов)
          content:
            application/json:
              schema:
                type: object
                required: [query, photos]
                properties:
                  query: { type: string }
                  photos:
                    type: array
                    items: { $ref: "#/components/schemas/PublicPhoto" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/ShopUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/public/lead-click:
    post:
      operationId: createLeadClick
      summary: >
        Фиксация клика «написать по товару». visitor_hash строится из
        анонимной cookie kv (устанавливается сервером) и IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shop_id, channel]
              properties:
                shop_id: { type: string, format: uuid }
                photo_id: { type: string, format: uuid }
                channel: { type: string, enum: [telegram, whatsapp, max, vk] }
      responses:
        "204": { description: Лид зафиксирован }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/ShopUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/public/sitemap:
    get:
      operationId: getPublicSitemap
      summary: Активные магазины для sitemap витрины
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [shops]
                properties:
                  shops:
                    type: array
                    items:
                      type: object
                      required: [slug, updated_at]
                      properties:
                        slug: { type: string }
                        updated_at: { type: string, format: date-time }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/public/config:
    get:
      operationId: getPublicConfig
      summary: Рантайм-настройки фронтов (DSN Sentry для отчётов об ошибках)
      responses:
        "200":
          description: OK. Пустой sentry_dsn — отчёты об ошибках выключены
          content:
            application/json:
              schema:
                type: object
                required: [sentry_dsn]
                properties:
                  sentry_dsn: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/public/complaints:
    post:
      operationId: createComplaint
      summary: Жалоба правообладателя на контент (notice-and-takedown), без auth
      description: >
        Жалоба привязывается к магазину/фото, если ссылку удалось распознать
        (/{slug} или /media/{shop_id}/{photo_id}/...); нераспознанный URL
        не мешает подать жалобу. Модератор получает email-уведомление.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, reporter_name, reporter_email, reason]
              properties:
                url: { type: string, minLength: 1, maxLength: 1000, description: "Ссылка на страницу витрины или файл, http(s) (схема необязательна); иначе 400 invalid_url" }
                reporter_name: { type: string, minLength: 1, maxLength: 200 }
                reporter_email: { type: string, format: email }
                reason: { type: string, minLength: 10, maxLength: 5000 }
      responses:
        "201":
          description: Жалоба зарегистрирована
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, const: open }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/admin/overview:
    get:
      operationId: adminOverview
      summary: "[admin] Сводка платформы"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [active_shops, suspended_shops, ready_photos, open_complaints, storage_used]
                properties:
                  active_shops: { type: integer }
                  suspended_shops: { type: integer }
                  ready_photos: { type: integer }
                  open_complaints: { type: integer }
                  storage_used: { type: integer, format: int64 }
        "404":
          description: Не админ — админ-зона не раскрывается
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/shops:
    get:
      operationId: adminListShops
      summary: "[admin] Продавцы, сначала те, на кого больше жалоб"
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
          description: 1–500; значение вне диапазона или не число — 100.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminShop" }
        "404":
          description: Не админ — админ-зона не раскрывается
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/complaints:
    get:
      operationId: adminListComplaints
      summary: "[admin] Список жалоб (фильтр по статусу)"
      description: Все /api/v1/admin/* доступны только role=admin; остальным — 404.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, in_review, resolved, rejected] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminComplaint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/complaints/{complaintID}:
    patch:
      operationId: adminUpdateComplaint
      summary: "[admin] Сменить статус жалобы (с записью в аудит-лог)"
      parameters:
        - name: complaintID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [open, in_review, resolved, rejected] }
      responses:
        "200":
          description: Статус обновлён
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/admin/photos/flagged:
    get:
      operationId: adminListFlaggedPhotos
      summary: "[admin] Фото, помеченные стоп-словами на ручную проверку"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, shop_id, shop_slug, album_id, caption, status]
                  properties:
                    id: { type: string, format: uuid }
                    shop_id: { type: string, format: uuid }
                    shop_slug: { type: string }
                    album_id: { type: string, format: uuid }
                    caption: { type: string }
                    status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/photos/{photoID}/block:
    post:
      operationId: adminBlockPhoto
      summary: "[admin] Скрыть фото (status=blocked, деривативы удаляются из CDN)"
      description: >
        Оригинал в S3 сохраняется. Владелец магазина получает email.
        Действие идемпотентно и пишется в аудит-лог.
      parameters:
        - name: photoID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminActionBody" }
      responses:
        "200":
          description: Фото заблокировано
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, const: blocked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/admin/photos/{photoID}/unflag:
    post:
      operationId: adminUnflagPhoto
      summary: "[admin] Снять флаг ручной проверки (ложное срабатывание стоп-слова)"
      parameters:
        - name: photoID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Флаг снят }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/albums/{albumID}/hide:
    post:
      operationId: adminHideAlbum
      summary: "[admin] Скрыть альбом с витрины (status=draft), email владельцу"
      parameters:
        - name: albumID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminActionBody" }
      responses:
        "204": { description: Альбом скрыт }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /api/v1/admin/photos/{photoID}/unblock:
    post:
      operationId: adminUnblockPhoto
      summary: Снять блокировку с фото (жалоба отклонена)
      description: >
        Фото уходит на повторную обработку: деривативы при блокировке
        удалены, оригинал сохранён как раз на такой случай. 404, если фото
        нет или оно не было заблокировано.
      parameters:
        - name: photoID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminActionBody" }
      responses:
        "200":
          description: Блокировка снята, фото в обработке
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/albums/{albumID}/unhide:
    post:
      operationId: adminUnhideAlbum
      summary: Снять блокировку альбома (жалоба отклонена)
      parameters:
        - name: albumID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminActionBody" }
      responses:
        "204":
          description: Блокировка снята
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/shops/{shopID}/unsuspend:
    post:
      operationId: adminUnsuspendShop
      summary: Снять блокировку магазина (жалоба отклонена)
      description: 404, если магазин не найден или не был заблокирован.
      parameters:
        - name: shopID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminActionBody" }
      responses:
        "204":
          description: Блокировка снята
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/shops/{shopID}/suspend:
    post:
      operationId: adminSuspendShop
      summary: "[admin] Снять магазин с публикации (status=suspended), email владельцу"
      parameters:
        - $ref: "#/components/parameters/ShopID"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminActionBody" }
      responses:
        "204": { description: Магазин снят с публикации }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

components:
  parameters:
    ShopSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    ShopID:
      name: shopID
      in: path
      required: true
      schema: { type: string, format: uuid }
    AlbumID:
      name: albumID
      in: path
      required: true
      schema: { type: string, format: uuid }

  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email, password]
            properties:
              email: { type: string, format: email }
              # Длиннее 128 символов: регистрация — 400 password_too_long,
              # вход — 401 invalid_credentials (без хеширования).
              password: { type: string, minLength: 8, maxLength: 128 }

  responses:
    ShopUnavailable:
      description: >
        Витрина скрыта за неоплату. Отличается от 404 намеренно: покупателю
        отдаются имя и контакты продавца, чтобы он мог написать напрямую.
      content:
        application/json:
          schema:
            type: object
            required: [error, shop]
            properties:
              error: { type: string, enum: [shop_unavailable] }
              message: { type: string }
              shop:
                type: object
                required: [name, contacts]
                properties:
                  name: { type: string }
                  contacts: { type: object, additionalProperties: { type: string } }

    BadRequest:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Нет или истекла сессия / неверные креды
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Ресурс не найден или принадлежит другому пользователю
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Конфликт (занятый email/slug)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Тело не application/json (error=unsupported_media_type)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Превышен rate-limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, description: Машинный код ошибки }
        message: { type: string }

    User:
      type: object
      required: [id, role, email_verified]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, "null"], format: email }
        role: { type: string, enum: [user, admin] }
        email_verified: { type: boolean }

    ShopStats:
      type: object
      required: [days, totals, daily, channels, top_albums, top_photos]
      properties:
        days: { type: integer }
        totals:
          type: object
          required: [views, unique_visitors, lead_clicks]
          properties:
            views: { type: integer }
            unique_visitors: { type: integer }
            lead_clicks: { type: integer }
        daily:
          type: array
          items:
            type: object
            required: [date, views, unique_visitors, lead_clicks]
            properties:
              date: { type: string, format: date }
              views: { type: integer }
              unique_visitors: { type: integer }
              lead_clicks: { type: integer }
        channels:
          type: array
          items:
            type: object
            required: [channel, clicks]
            properties:
              channel: { type: string, enum: [telegram, whatsapp, max, vk] }
              clicks: { type: integer }
        albums_viewed_week:
          type: integer
          description: >
            Сколько разных альбомов открывали за последние 7 дней. Окно
            фиксированное, от параметра days не зависит.
        top_albums:
          type: array
          maxItems: 5
          items:
            type: object
            required: [album_id, title, views]
            properties:
              album_id: { type: string, format: uuid }
              title: { type: string }
              views: { type: integer }
        top_photos:
          type: array
          maxItems: 10
          items:
            type: object
            required: [photo_id, caption, clicks]
            properties:
              photo_id: { type: string, format: uuid }
              caption: { type: string }
              clicks: { type: integer }
              thumb_url: { type: string }

    AdminActionBody:
      type: object
      additionalProperties: false
      description: Необязательная привязка действия модератора к жалобе (аудит-лог)
      properties:
        complaint_id: { type: string, format: uuid }
        note: { type: string }

    AdminShop:
      type: object
      required: [id, slug, name, plan, status, billing_state, storage_used, photos, complaints]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        email: { type: string }
        plan: { $ref: "#/components/schemas/PlanID" }
        status: { type: string }
        billing_state: { $ref: "#/components/schemas/BillingState" }
        storage_used: { type: integer, format: int64 }
        photos: { type: integer }
        complaints: { type: integer }

    AdminComplaint:
      type: object
      required: [id, shop_id, shop_slug, photo_id, photo_album_id, reason,
                 reporter_name, reporter_email, content_url, status, created_at, resolved_at]
      properties:
        id: { type: string, format: uuid }
        shop_id: { type: [string, "null"], format: uuid }
        shop_slug: { type: [string, "null"] }
        photo_id: { type: [string, "null"], format: uuid }
        photo_album_id: { type: [string, "null"], format: uuid }
        reason: { type: string }
        reporter_name: { type: string }
        reporter_email: { type: string }
        content_url: { type: string }
        status: { type: string, enum: [open, in_review, resolved, rejected] }
        created_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }

    Shop:
      type: object
      required: [id, slug, name, description, contacts, settings, status, plan,
                 billing_state, paid_until, storage_used, storage_max, max_photos]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        contacts: { type: object }
        settings: { type: object }
        status: { type: string, enum: [active, suspended, deleted] }
        plan: { $ref: "#/components/schemas/PlanID" }
        billing_state: { $ref: "#/components/schemas/BillingState" }
        paid_until: { type: [string, "null"], format: date-time }
        storage_used: { type: integer }
        storage_max: { type: integer }
        max_photos: { type: integer }

    PlanID:
      type: string
      description: >
        Тарифы по возрастанию: free «Бесплатный», standard «Стандарт», pro «Про»,
        business «Бизнес». На free закрыты аналитика, водяной знак и пароли альбомов
        (403 analytics_plan_required / watermark_plan_required / password_plan_required).
      enum: [free, standard, pro, business]

    BillingPeriod:
      type: string
      description: Период оплаты; год — 12 месяцев со скидкой 25%.
      enum: [month, year]

    BillingState:
      type: string
      description: >
        Устаревшее: по окончании оплаты аккаунт переходит на Бесплатный, витрина
        работает. Новые значения кроме ok не выставляются.
      enum: [ok, grace, suspended]

    PlanInfo:
      type: object
      required: [id, max_photos, max_storage, price_rub, price_year_rub]
      properties:
        id: { $ref: "#/components/schemas/PlanID" }
        max_photos: { type: integer }
        max_storage: { type: integer, description: Байты }
        price_rub: { type: integer, description: "Цена за месяц, рубли (0 = бесплатно)" }
        price_year_rub: { type: integer, description: "Цена за год со скидкой 25%, рубли" }

    Billing:
      type: object
      required: [plan, billing_state, paid_until, trial_ends_at, trial_available, usage, limits, subscription, plans, failed_payment]
      properties:
        plan: { $ref: "#/components/schemas/PlanID" }
        billing_state: { $ref: "#/components/schemas/BillingState" }
        paid_until: { type: [string, "null"], format: date-time }
        trial_ends_at:
          type: [string, "null"]
          format: date-time
          description: Когда кончится (или кончился) пробный «Про»; null — не брали.
        trial_available:
          type: boolean
          description: Пробный «Про» ещё можно включить (один раз, не после платного тарифа).
        usage:
          type: object
          required: [photos, storage_used, trash_photos, trash_bytes]
          properties:
            photos: { type: integer }
            storage_used: { type: integer }
            trash_photos: { type: integer, description: Фото в «Удаленном» }
            trash_bytes: { type: integer, description: Их объём, байты }
        limits: { $ref: "#/components/schemas/PlanInfo" }
        subscription:
          type: [object, "null"]
          required: [plan, status, period, period_end, auto_renew, next_plan, next_period]
          properties:
            plan: { $ref: "#/components/schemas/PlanID" }
            status: { type: string, enum: [active, past_due, canceled, expired] }
            period: { $ref: "#/components/schemas/BillingPeriod" }
            period_end: { type: string, format: date-time }
            auto_renew: { type: boolean }
            next_plan:
              description: Переход ниже, запланированный на конец периода.
              oneOf: [{ $ref: "#/components/schemas/PlanID" }, { type: "null" }]
            next_period:
              oneOf: [{ $ref: "#/components/schemas/BillingPeriod" }, { type: "null" }]
        plans:
          type: array
          items: { $ref: "#/components/schemas/PlanInfo" }
        failed_payment:
          type: [object, "null"]
          description: Последняя оплата продавца не прошла (в течение суток) — плашка «Оплата не прошла».
          required: [plan, period]
          properties:
            plan: { $ref: "#/components/schemas/PlanID" }
            period: { $ref: "#/components/schemas/BillingPeriod" }

    BillingQuote:
      type: object
      required: [action, plan, period, amount_rub, days, period_end]
      properties:
        action:
          type: string
          enum: [pay, schedule, current]
          description: >
            pay — нужна оплата; schedule — переход ниже с конца оплаченного
            периода, без оплаты; current — это текущий тариф.
        kind:
          type: string
          enum: [period, upgrade, switch]
          description: >
            period — оплата периода; upgrade — доплата разницы до конца периода
            по дням (дата списания не меняется); switch — переход на год,
            период начинается сразу, остаток месяца засчитан.
        plan: { $ref: "#/components/schemas/PlanID" }
        period: { $ref: "#/components/schemas/BillingPeriod" }
        from_plan: { $ref: "#/components/schemas/PlanID" }
        amount_rub: { type: integer }
        days: { type: integer, description: Дни доплаты (upgrade) или зачёта (switch) }
        period_end: { type: string, format: date-time }

    Payment:
      type: object
      required: [id, created_at, plan, from_plan, kind, period, amount_rub, status, recurring, period_start, period_end]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        plan: { $ref: "#/components/schemas/PlanID" }
        from_plan:
          oneOf: [{ $ref: "#/components/schemas/PlanID" }, { type: "null" }]
        kind: { type: string, enum: [period, upgrade, switch] }
        period: { $ref: "#/components/schemas/BillingPeriod" }
        amount_rub: { type: integer }
        status: { type: string, enum: [succeeded, canceled] }
        recurring: { type: boolean, description: Автосписание }
        period_start: { type: [string, "null"], format: date-time }
        period_end: { type: [string, "null"], format: date-time }

    Album:
      type: object
      required: [id, parent_id, title, cover_photo_id, sort_order, status, photo_count]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: [string, "null"], format: uuid }
        title: { type: string }
        cover_photo_id: { type: [string, "null"], format: uuid }
        sort_order: { type: integer, format: int32 }
        status: { $ref: "#/components/schemas/AlbumStatus" }
        description:
          type: string
          maxLength: 2000
          description: Условия покупки; на витрине показывается над фотографиями
        category_id:
          type: string
          format: uuid
          nullable: true
          description: Первая из категорий альбома (см. category_ids)
        category_ids:
          type: array
          items: { type: string, format: uuid }
          description: >
            Все категории альбома — он может лежать в нескольких. Полный
            список отдаёт listAlbums; в ответах по одному альбому здесь
            только первая.
        category_pos:
          type: object
          additionalProperties: { type: integer }
          description: >
            Место альбома в каждой из его категорий (id категории → номер).
            Только в listAlbums. Меняется через setCategoryAlbumOrder.
        photo_count: { type: integer }
        has_password:
          type: boolean
          description: >
            Альбом закрыт паролем. Сам пароль и его хеш наружу не отдаются.
        watermark: { $ref: "#/components/schemas/AlbumWatermark" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cover_urls:
          type: object
          description: >
            Адреса деривативов обложки (small/medium/large). Отдаются только
            когда у альбома есть обложка: базовый префикс медиа знает сервер.
          properties:
            small: { type: string }
            medium: { type: string }
            large: { type: string }

    ShopSettings:
      type: object
      description: Хранится в shops.settings; отдельного эндпоинта нет — PATCH /shops/{shopID}
      properties:
        msg_template:
          type: string
          maxLength: 200
          description: Текст для мессенджера, подстановка {caption}
        reply_time:
          type: string
          maxLength: 100
          description: >
            Когда продавец отвечает. Показывается покупателю рядом
            с кнопками связи — единственная настройка помимо msg_template,
            которая уходит наружу.
        watermark:
          type: object
          description: >
            Знак накладывается при загрузке, а не на лету: смена настроек
            не затрагивает уже загруженные фотографии.
          properties:
            enabled: { type: boolean }
            text: { type: string, maxLength: 40 }
            opacity: { type: number, minimum: 0, maximum: 1 }
            position: { $ref: '#/components/schemas/WatermarkPosition' }

    AlbumStatus:
      type: string
      enum: [published, unlisted, draft]
      description: >
        published — виден на витрине и в списках;
        unlisted — «по ссылке»: нет в списках, прямая ссылка работает;
        draft — не виден покупателю нигде.

    Tab:
      type: object
      required: [id, title, slug, is_system, sort_order]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 100 }
        slug: { type: string }
        is_system:
          type: boolean
          description: Системные («Главная», «Альбомы», «Контакты») не удаляются
        sort_order: { type: integer, format: int32 }

    Section:
      type: object
      required: [id, tab_id, title, sort_order]
      properties:
        id: { type: string, format: uuid }
        tab_id: { type: string, format: uuid }
        title: { type: string, maxLength: 100 }
        sort_order: { type: integer, format: int32 }
        album_ids:
          type: array
          items: { type: string, format: uuid }

    AlbumWatermark:
      type: [object, "null"]
      description: >
        Свой водяной знак альбома (включён ли и где); null — как у магазина
        (settings.watermark). Текст знака общий для магазина. Без position —
        br. Неверное значение — 400 invalid_watermark, и тогда альбом не
        создаётся и не меняется (остальные поля запроса тоже не пишутся).
      properties:
        enabled: { type: boolean }
        position: { $ref: '#/components/schemas/WatermarkPosition' }

    WatermarkPosition:
      type: string
      pattern: '^(tile|(tl|tc|tr|ml|mc|mr|bl|bc|br)(,(tl|tc|tr|ml|mc|mr|bl|bc|br))*)$'
      description: >
        Точки кадра на сетке 3×3 через запятую, без повторов: первая буква —
        строка (t верх, m середина, b низ), вторая — столбец (l, c, r);
        например «tl,br». «tile» — знак повторяется по всему кадру. Не
        задано — правый нижний угол. Смена знака альбома перерисовывает его
        готовые фото в фоне.

    PublicTab:
      type: object
      required: [title, slug]
      properties:
        title: { type: string }
        slug: { type: string }
        empty:
          type: boolean
          description: >
            Своя вкладка без видимых альбомов (системные пустыми не бывают).
            Витрина не показывает её в навигации; по прямой ссылке открывается.

    PublicSection:
      type: object
      required: [title, albums]
      properties:
        title: { type: string }
        albums:
          type: array
          items: { $ref: "#/components/schemas/PublicAlbum" }

    Category:
      type: object
      required: [id, title, slug, sort_order]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        title: { type: string, maxLength: 200 }
        slug: { type: string }
        sort_order: { type: integer, format: int32 }
        is_hidden:
          type: boolean
          description: Скрыта с витрины (вместе с подкатегориями)
        on_home:
          type: boolean
          description: Показывается блоком на главной витрины

    CategoryInput:
      type: object
      additionalProperties: false
      required: [title, slug]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9]|-[a-z0-9]){2,62}$"
          description: "3-63 символа: a-z, 0-9, одиночные дефисы"
        parent_id: { type: string, format: uuid, nullable: true }
        sort_order:
          type: integer
          format: int32
          description: >
            Место среди категорий своего уровня. Не передано: при создании
            категория встаёт в конец, при правке остаётся на своём месте.

    PublicCategory:
      type: object
      required: [title, slug, album_count]
      description: Наружу без id и служебных полей
      properties:
        parent_slug: { type: string, nullable: true }
        title: { type: string }
        slug: { type: string }
        album_count: { type: integer }
        on_home:
          type: boolean
          description: Категория показывается блоком на главной витрины

    PublicShop:
      type: object
      description: Публичная витрина — без email, storage_used, plan, status
      required: [id, slug, name, description, contacts, msg_template]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        contacts:
          type: object
          description: "Каналы связи: telegram/whatsapp/vk/max -> handle"
        msg_template:
          type: string
          description: Шаблон сообщения покупателя, плейсхолдер {caption}

    PublicAlbum:
      type: object
      required: [id, parent_id, title, photo_count]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: [string, "null"], format: uuid }
        title: { type: string }
        photo_count: { type: integer }
        unlisted:
          type: boolean
          description: >
            Альбом «по ссылке»: витрина ставит такой странице noindex, чтобы
            она не попадала в поиск — раз продавец убрал альбом из списков.
        cover_urls: { $ref: "#/components/schemas/PhotoUrls" }
        category_slugs:
          type: array
          items: { type: string }
          description: >
            Слаги категорий альбома — только в сетке магазина и только
            нескрытые. По ним главная собирает блоки категорий.
        category_pos:
          type: object
          additionalProperties: { type: integer }
          description: >
            Только в сетке магазина: место альбома в каждой из его категорий
            (слаг → номер). В этом порядке альбомы стоят в разделе категории.
        created_at:
          type: string
          format: date-time
          description: >
            Только в сетке магазина. Раздел «Альбомы» витрины показывает
            альбомы от новых к старым.
        has_password:
          type: boolean
          description: >
            Альбом закрыт паролем. В списках у такого альбома нет cover_urls:
            обложка выдала бы содержимое.
        locked:
          type: boolean
          description: >
            Только на странице альбома: содержимое не отдано (нет заголовка
            X-Album-Token или пропуск недействителен). photos, children и
            description в таком ответе пусты.

    PublicPhoto:
      type: object
      required: [id, album_id, caption, width, height, urls]
      properties:
        id: { type: string, format: uuid }
        album_id: { type: string, format: uuid }
        caption: { type: string }
        width: { type: integer }
        height: { type: integer }
        urls: { $ref: "#/components/schemas/PhotoUrls" }

    PhotoUrls:
      type: object
      description: >
        Деривативы WebP (300/800/1600). Префикс задаётся MEDIA_BASE_URL:
        относительный /media локально, абсолютный URL CDN-домена в проде —
        клиент должен подставлять значение как есть, не достраивая его.
      properties:
        small: { type: string }
        medium: { type: string }
        large: { type: string }

    Photo:
      type: object
      required: [id, album_id, caption, status, width, height, sort_order]
      properties:
        id: { type: string, format: uuid }
        album_id: { type: string, format: uuid }
        caption: { type: string }
        status: { type: string, enum: [uploading, processing, ready, failed, blocked] }
        width: { type: integer }
        height: { type: integer }
        sort_order: { type: integer, format: int32 }
        fail_reason:
          type: string
          enum: [unsupported_format, corrupt, too_large, empty, lost]
          description: >
            Только для status=failed. Код причины, а не текст: кабинет
            переводит его сам, чтобы продавец понял, что чинить.
            Первые четыре — про файл. lost — про нас: задача обработки
            потерялась, файл в порядке, помогает повторная загрузка.
        urls:
          type: object
          description: Только для status=ready; деривативы WebP (300/800/1600)
          properties:
            small: { type: string }
            medium: { type: string }
            large: { type: string }
