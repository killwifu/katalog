name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # libheif-plugin-libde265 — HEVC-декодер. Без него libvips читает
      # заголовок HEIC, но не декодирует пиксели: айфонные фото молча
      # не обрабатываются. В Debian (прод-образ) декодер встроен в libheif1,
      # в Ubuntu вынесен в отдельный плагин — без него CI не проверяет
      # формат, который продукт принимает.
      - name: Install libvips (govips)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev libheif-plugin-libde265
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend
      - name: Test (unit + integration, testcontainers)
        working-directory: backend
        run: go test -timeout 15m ./...

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [cabinet, storefront]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      # Бюджет производительности: JS витрины ≤ 100 КБ gzip на страницу.
      - name: Bundle budget (storefront)
        if: matrix.app == 'storefront'
        run: npm run check-bundle
      # Цены и лимиты на странице тарифов = то, что реально списывает биллинг.
      - name: Тарифы совпадают с конфигом (storefront)
        if: matrix.app == 'storefront'
        run: npm run check-plans

  # E2E витрины на полном стеке: сидинг демо-магазина, приёмка
  # «загрузил фото -> витрина обновилась ≤ 60 сек» (ISR-вебхук),
  # Lighthouse CI с ассертом LCP < 2.5s (мобильная эмуляция).
  storefront-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Start stack
        run: |
          cp .env.example .env
          # Загрузка идёт через Caddy (маршрут /{bucket}/orig/* + SigV4-подпись),
          # как в Codespaces и проде, а не напрямую в MinIO: иначе публичный
          # путь загрузки не покрыт e2e. S3_SIGNING_HOST намеренно пуст —
          # проверяем и дефолт «Host клиента как есть».
          echo "S3_PUBLIC_ENDPOINT=http://localhost" >> .env
          docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
      - name: Wait for stack
        run: |
          timeout 300 bash -c 'until curl -fsS http://localhost/healthz >/dev/null 2>&1; do sleep 3; done'
          timeout 120 bash -c 'until curl -fsS http://localhost/ >/dev/null 2>&1; do sleep 3; done'
      # Наружу торчит только загрузка в orig/. Корень бакета дал бы анонимный
      # ListBucket (bucket policy разрешает список drv/*) — перечисление фото
      # всех магазинов в обход is_hidden и password_hash альбомов.
      - name: S3 API не отдаёт список бакета наружу
        run: |
          for path in '/katalog/?list-type=2&prefix=drv' '/katalog?list-type=2&prefix=drv'; do
            body=$(curl -sL "http://localhost${path}")
            case "$body" in
              *ListBucketResult*)
                echo "S3 bucket listing exposed at ${path}"; echo "$body" | head -c 300; exit 1 ;;
            esac
          done
      - name: Заголовки безопасности отдаются наружу
        run: |
          headers=$(curl -sI http://localhost/ | tr 'A-Z' 'a-z')
          for h in x-frame-options content-security-policy x-content-type-options referrer-policy; do
            case "$headers" in
              *"$h"*) ;;
              *) echo "нет заголовка $h"; exit 1 ;;
            esac
          done

      - name: Seed demo shop + ISR e2e (photo visible ≤ 60s)
        working-directory: backend
        run: go run ./cmd/seed -e2e -out ../seed.json
      - name: Lighthouse CI (LCP < 2.5s)
        working-directory: frontend/storefront
        run: |
          SHOP_URL=$(node -p "require('../../seed.json').shop_url")
          ALBUM_URL=$(node -p "require('../../seed.json').album_url")
          npx --yes @lhci/cli@0.14.x autorun --collect.url="$SHOP_URL" --collect.url="$ALBUM_URL"
      - name: Stack logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --tail=150

  # Сборка образов. На push в main они же уезжают в GHCR — оттуда их тянет
  # deploy/docker-compose.prod.yml. На pull_request только сборка: пушить
  # из форка нельзя, да и незачем.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: .
            dockerfile: backend/Dockerfile
            target: api
          - image: worker
            context: .
            dockerfile: backend/Dockerfile
            target: worker
          - image: migrate
            context: .
            dockerfile: backend/Dockerfile
            target: migrate
          - image: storefront
            context: frontend/storefront
            dockerfile: frontend/storefront/Dockerfile
            target: ""
          - image: cabinet
            context: frontend/cabinet
            dockerfile: frontend/cabinet/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Публикуем только с main
        id: release
        run: echo "push=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: steps.release.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ steps.release.outputs.push == 'true' }}
          # sha — на него пиниться в проде и откатываться; latest — для «просто обнови».
          tags: |
            ghcr.io/${{ github.repository_owner }}/katalog-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/katalog-${{ matrix.image }}:latest

  # Выкладка на сервер по SSH. Выключена, пока в переменных репозитория
  # не выставлен DEPLOY_ENABLED=true (Settings -> Secrets and variables ->
  # Actions -> Variables): иначе каждый push в main падал бы на отсутствующих
  # доступах. Нужные секреты и переменные перечислены в README.
  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    needs: [backend, frontend, storefront-e2e, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    # Два деплоя одновременно на один сервер — гарантированная гонка.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || 22 }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - name: Ключ и known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Отпечаток сервера берём из секрета, а не StrictHostKeyChecking=no:
          # иначе подмена сервера пройдёт незамеченной. Значение получить так:
          # ssh-keyscan -p <port> <host>
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Токен job'а даёт packages:read — долгоживущий PAT на сервере не нужен.
      # Уходит через stdin, а не аргументом: иначе светился бы в ps на сервере.
      - name: Логин в GHCR на сервере
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Обновить стек
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' SHA='${{ github.sha }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # Компоуз и Caddyfile лежат в том же репозитории, что и образы,
          # поэтому рабочая копия переключается на тот же коммит.
          git fetch --quiet origin main
          git checkout --quiet --detach "$SHA"

          # IMAGE_TAG из окружения перебивает значение из .env: катим ровно
          # тот коммит, который собрал CI, а не плавающий latest.
          export IMAGE_TAG="$SHA"
          COMPOSE="docker compose --env-file .env -f deploy/docker-compose.prod.yml"
          $COMPOSE pull --quiet
          $COMPOSE up -d --remove-orphans

          docker logout ghcr.io
          docker image prune -f
          REMOTE

      - name: Проверить, что сервис поднялся
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 "https://${{ vars.APP_DOMAIN }}/healthz" >/dev/null; then
              echo "healthz отвечает"
              exit 0
            fi
            sleep 5
          done
          echo "healthz не ответил за 150 секунд — стек не поднялся" >&2
          exit 1
