name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libvips (govips)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend
      - name: Test (unit + integration, testcontainers)
        working-directory: backend
        run: go test -timeout 15m ./...

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [cabinet, storefront]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      # Бюджет производительности: JS витрины ≤ 100 КБ gzip на страницу.
      - name: Bundle budget (storefront)
        if: matrix.app == 'storefront'
        run: npm run check-bundle

  # E2E витрины на полном стеке: сидинг демо-магазина, приёмка
  # «загрузил фото -> витрина обновилась ≤ 60 сек» (ISR-вебхук),
  # Lighthouse CI с ассертом LCP < 2.5s (мобильная эмуляция).
  storefront-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Start stack
        run: |
          cp .env.example .env
          # Загрузка идёт через Caddy (маршрут /{bucket}/orig/* + SigV4-подпись),
          # как в Codespaces и проде, а не напрямую в MinIO: иначе публичный
          # путь загрузки не покрыт e2e. S3_SIGNING_HOST намеренно пуст —
          # проверяем и дефолт «Host клиента как есть».
          echo "S3_PUBLIC_ENDPOINT=http://localhost" >> .env
          docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
      - name: Wait for stack
        run: |
          timeout 300 bash -c 'until curl -fsS http://localhost/healthz >/dev/null 2>&1; do sleep 3; done'
          timeout 120 bash -c 'until curl -fsS http://localhost/ >/dev/null 2>&1; do sleep 3; done'
      # Наружу торчит только загрузка в orig/. Корень бакета дал бы анонимный
      # ListBucket (bucket policy разрешает список drv/*) — перечисление фото
      # всех магазинов в обход is_hidden и password_hash альбомов.
      - name: S3 API не отдаёт список бакета наружу
        run: |
          for path in '/katalog/?list-type=2&prefix=drv' '/katalog?list-type=2&prefix=drv'; do
            body=$(curl -sL "http://localhost${path}")
            case "$body" in
              *ListBucketResult*)
                echo "S3 bucket listing exposed at ${path}"; echo "$body" | head -c 300; exit 1 ;;
            esac
          done
      - name: Seed demo shop + ISR e2e (photo visible ≤ 60s)
        working-directory: backend
        run: go run ./cmd/seed -e2e -out ../seed.json
      - name: Lighthouse CI (LCP < 2.5s)
        working-directory: frontend/storefront
        run: |
          SHOP_URL=$(node -p "require('../../seed.json').shop_url")
          ALBUM_URL=$(node -p "require('../../seed.json').album_url")
          npx --yes @lhci/cli@0.14.x autorun --collect.url="$SHOP_URL" --collect.url="$ALBUM_URL"
      - name: Stack logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --tail=150

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            context: .
            dockerfile: backend/Dockerfile
            target: api
          - image: worker
            context: .
            dockerfile: backend/Dockerfile
            target: worker
          - image: storefront
            context: frontend/storefront
            dockerfile: frontend/storefront/Dockerfile
            target: ""
          - image: cabinet
            context: frontend/cabinet
            dockerfile: frontend/cabinet/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          tags: katalog/${{ matrix.image }}:ci
