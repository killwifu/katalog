name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libvips (govips)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend
      - name: Test (unit + integration, testcontainers)
        working-directory: backend
        run: go test -timeout 15m ./...

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [cabinet, storefront]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            context: .
            dockerfile: backend/Dockerfile
            target: api
          - image: worker
            context: .
            dockerfile: backend/Dockerfile
            target: worker
          - image: storefront
            context: frontend/storefront
            dockerfile: frontend/storefront/Dockerfile
            target: ""
          - image: cabinet
            context: frontend/cabinet
            dockerfile: frontend/cabinet/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          tags: katalog/${{ matrix.image }}:ci
